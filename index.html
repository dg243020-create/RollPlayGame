<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPG プロトタイプ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#10141f;--ink:#e8ecf5;--mut:#8b94a8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{max-width:100%;height:auto;background:#1b2a24;border:2px solid #2c3a52;border-radius:6px}
p{margin:0;color:var(--mut);text-align:center;padding:0 12px;max-width:800px}
#login{position:fixed;inset:0;background:#10141f;display:flex;align-items:center;justify-content:center;z-index:10}
#login .card{background:#1b2233;border:2px solid #2c3a52;border-radius:10px;padding:28px 36px;text-align:center;max-width:420px}
#login h1{margin:0 0 12px;font-size:20px}
#login p{margin:0 0 18px;padding:0}
#login button{font:inherit;font-weight:bold;padding:10px 22px;border:0;border-radius:6px;background:#ffe27a;color:#10141f;cursor:pointer}
#login button:disabled{background:#555;color:#999;cursor:default}
</style></head><body>
<div id="login"><div class="card"><h1>RPG プロトタイプ</h1><p id="lmsg">Googleアカウントでログインして、続きから始めよう。</p><button id="lbtn">Googleでログイン</button></div></div>
<canvas id="c" width="800" height="480"></canvas>
<p>移動: WASD / 矢印キー ・ 攻撃: Space ・ スキル: K / L<br>デバッグ: <b>+</b> <b>-</b> でレベル変更 ・ <b>0</b> でLv10 ・ <b>5</b> でLv50 ・ <b>B</b> でボス1 ・ <b>V</b> でボス2(もう一度押すと撤退) ・ <b>F</b> でフィールド切替 ・ <b>Tab</b> でメニュー(ステータス・装備・素材) ・ <b>E</b> アクション(会話・教会・鍛冶屋など。スキル強化・ステータス振り分け・セーブは教会で)<br>Lv9で経験値が満タンになったら、洞窟の最深部のボスを倒すとLv10に上がります</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=800,H=480;
const JOBS={
 none:{n:'見習い',c:'#d8d2c0',hp:12,atk:3,r:50,a:[.55,0,.55,1,0]},
 knight:{n:'ナイト',c:'#e0453f',hp:20,atk:5,r:60,a:[.55,0,.55,1,.04],d:'近接で戦う。薙ぎ払いで周囲をまとめて攻撃',
  sk:[{n:'薙ぎ払い',r:90,m:2,cd:3,mp:8,self:1},{n:'大振り',r:60,m:5,cd:7,mp:15,self:1}]},
 mage:{n:'メイジ',c:'#9b59e0',hp:8,atk:3,r:150,a:[.65,.005,.35,1.1,.02],mg:1,d:'高火力の魔法使い。ヒールはできない',
  sk:[{n:'ワイドフレア',r:110,m:3,cd:2.5,mp:10},{n:'メテオ',r:50,m:10,cd:9,mp:25}]},
 healer:{n:'ヒーラー',c:'#3fbf6a',hp:12,atk:3,r:130,a:[.5,.004,.28,.7,.01],mg:1,d:'範囲攻撃とヒールで戦線を支える',
  sk:[{n:'ホーリーライト',r:90,m:1.6,cd:1.2,mp:5,h:.04},{n:'ヒール',heal:.4,cd:6,mp:12}]}
};
const GATE=10; // このレベルに上がるにはボス討伐が必要
const FD=[
 {n:'始まりの町 ルーメン',lv:[0,0],bg:'#2b2a26',gr:'#3a372f',town:1,en:null},
 {n:'はじまりの草原',lv:[1,6],bg:'#1b2a24',gr:'#22352c',en:[['slime',5],['rabbit',3]]},
 {n:'暗い洞窟',lv:[6,14],bg:'#1f1e2b',gr:'#2b2a3d',en:[['bat',4],['golem',2],['spider',3]]},
 {n:'洞窟の最深部',lv:[0,0],bg:'#120f1a',gr:'#221d30',boss:1,en:null},
 {n:'ささやきの森',lv:[14,28],bg:'#14281c',gr:'#1d3a2a',en:[['wolf',4],['spore',3],['bee',3]]},
 {n:'灼熱の火山',lv:[28,50],bg:'#2e1a16',gr:'#44261f',en:[['imp',4],['lizard',3],['magma',2]]}
];
const TY={
 slime:{n:'スライム',c:'#5ec26a',r:12,hp:1,dm:.8,sp:.8,xp:1,dr:[['gel',.55],['bgel',.07]]},
 rabbit:{n:'ホーンラビット',c:'#e8d9b8',r:10,hp:.7,dm:.7,sp:1.5,xp:1.1,dr:[['fur',.5],['tail',.07]]},
 wolf:{n:'フォレストウルフ',c:'#8a8f9c',r:13,hp:1.1,dm:1.1,sp:1.4,xp:1.2,dr:[['fang',.5],['sfur',.07]]},
 spore:{n:'キノコ兵',c:'#c05a8f',r:13,hp:1.5,dm:.9,sp:.6,xp:1.3,dr:[['mush',.55],['spore',.07]]},
 bee:{n:'ジャイアントビー',c:'#e8c23a',r:9,hp:.6,dm:1.2,sp:1.8,xp:1.2,dr:[['honey',.5],['sting',.06]]},
 bat:{n:'ケイブバット',c:'#6a5a9a',r:10,hp:.7,dm:1,sp:1.8,xp:1.3,dr:[['wing',.5],['mwing',.07]]},
 golem:{n:'ストーンゴーレム',c:'#9a8f80',r:17,hp:2.2,dm:1.3,sp:.5,xp:1.8,dr:[['stone',.55],['gcore',.06]]},
 spider:{n:'ケイブスパイダー',c:'#4a3a4a',r:12,hp:1,dm:1.1,sp:1.2,xp:1.4,dr:[['silk',.5],['venom',.07]]},
 imp:{n:'インプ',c:'#e0453f',r:11,hp:1,dm:1.2,sp:1.3,xp:1.5,dr:[['horn',.5],['more',.06]]},
 lizard:{n:'ファイアリザード',c:'#e07a3f',r:13,hp:1.4,dm:1.2,sp:1,xp:1.6,dr:[['scale',.5],['tear',.06]]},
 magma:{n:'マグマスライム',c:'#ff5a2a',r:15,hp:2,dm:1.4,sp:.6,xp:2,dr:[['ember',.55],['heart',.05]]}
};
const ITEMS={gel:['スライムゼリー','#5ec26a'],bgel:['青いゼリー','#4a9bff'],fur:['ウサギの毛皮','#e8d9b8'],tail:['幸運のしっぽ','#ffd84a'],fang:['狼の牙','#cfd4dc'],sfur:['銀の毛皮','#c0c8d8'],mush:['毒きのこ','#c05a8f'],spore:['輝く胞子','#7dff9d'],honey:['はちみつ','#e8c23a'],sting:['女王の針','#ffd84a'],wing:['コウモリの羽','#8a7ac0'],mwing:['月光の羽','#cfe8ff'],stone:['石のかけら','#9a8f80'],gcore:['ゴーレムの核','#ffd84a'],silk:['蜘蛛の糸','#dcdcdc'],venom:['猛毒の牙','#8aff6a'],horn:['小鬼の角','#e0453f'],more:['魔鉱石','#9b59e0'],scale:['炎の鱗','#e07a3f'],tear:['竜の涙','#7ad9ff'],ember:['溶岩の欠片','#ff5a2a'],heart:['火山の心臓','#ff3a3a']};
let FI=0;cv.style.background=FD[0].bg;
const K={};let P={x:400,y:240,lv:1,exp:0,job:'none',hp:16,cd:[0,0,0],sk:[1,1],ba:1,st:[0,0,0,0,0],mp:999,face:1,hit:0,gk:0,gm:0,inv:{},eq:{w:null,a:null},cr:{}},E=[],HZ=[],B=null,F=[],R=[],state='play',msg={t:0,s:''};
const J=()=>JOBS[P.job],need=l=>10+l*l*3,maxHp=()=>J().hp+P.lv*4+P.st[0]*3,maxMp=()=>20+P.lv*2+P.st[1]*2,aInt=()=>{const a=J().a;return Math.max(a[2],a[0]-a[1]*P.lv)*(1-.02*(P.ba-1))},aMul=()=>{const a=J().a;return (a[3]+a[4]*P.lv)*(1+.08*(P.ba-1))};
const stp=()=>(P.lv-1)*3-P.st.reduce((a,b)=>a+b,0),pts=()=>P.lv-1-(P.ba-1)-(P.sk[0]-1)-(P.sk[1]-1),sm=(s,i)=>(s.m||0)*(1+.12*(P.sk[i]-1)),scd=(s,i)=>s.cd*(1-.03*(P.sk[i]-1)),sh=(s,i)=>(s.heal||0)*(1+.05*(P.sk[i]-1))*(1+.02*P.st[3]);
const say=s=>msg={t:2.4,s};
const fl=(x,y,tx,c,sz)=>F.push({x,y,tx,c,sz,t:1});
const ring=(x,y,r,c,d=.35)=>R.push({x,y,r,c,t:d,d});
P.hp=maxHp();
let PJ=[],LS=[],U=null;const clr=()=>{HZ=[];PJ=[];LS=[];U=null};
function setLv(l){P.lv=Math.max(1,Math.min(50,l));P.exp=0;P.gk=P.lv>=GATE?1:0;P.gm=0;if(P.lv<10)P.job='none';if(pts()<0||P.job=='none')P.sk=[1,1];if(pts()<0)P.ba=1;if(stp()<0)P.st=[0,0,0,0,0];P.hp=maxHp();if(P.lv>=10&&P.job=='none')state='select'}
function gain(n){
 touch=1;P.exp+=n;fl(P.x,P.y-34,'+'+n+' EXP','#8fd3ff',13);
 while(P.lv<50&&P.exp>=need(P.lv)){
  if(P.lv==GATE-1&&!P.gk){
   P.exp=need(P.lv);
   if(!P.gm){P.gm=1;say('Lv'+GATE+'の試練! 洞窟の最深部のボスを倒せ')}
   break;
  }
  P.exp-=need(P.lv);P.lv++;P.hp=maxHp();ring(P.x,P.y,140,'#ffe27a',.7);say('レベルアップ! Lv'+P.lv);
  if(P.lv==10){state='select'}
  if(P.lv==50)say('Lv50到達! 上級職はこれから実装予定')
 }
}
addEventListener('keydown',e=>{
 K[e.code]=1;
 if(state=='login')return;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
 if(state=='select'){
  const j={Digit1:'knight',Digit2:'mage',Digit3:'healer'}[e.code];
  if(j){P.job=j;P.sk=[1,1];state='play';P.hp=maxHp();say(JOBS[j].n+'に転職した!');ring(P.x,P.y,160,JOBS[j].c,.8)}
  return;
 }
 if(state=='church'){
  if(e.code=='Escape'||e.code=='KeyE'){state='play';return}
  if(e.code=='Digit1')state='skills';
  else if(e.code=='Digit2')state='stats';
  else if(e.code=='Digit3'){P.hp=maxHp();P.mp=maxMp();ring(P.x,P.y,70,'#7dff9d');chm='HP/MPが全回復した'}
  else if(e.code=='Digit4')saveGame();
  return}
 if(state=='menu'){
  if(e.code=='Tab'||e.code=='Escape'){state='play';return}
  if(e.code=='KeyA'||e.code=='ArrowLeft')MT=(MT+2)%3;
  else if(e.code=='KeyD'||e.code=='ArrowRight')MT=(MT+1)%3;
  else if(/^Digit[1-3]$/.test(e.code))MT=+e.code.slice(-1)-1;
  else if(MT==0){const n=OWN().length;if(n){if(e.code=='KeyW'||e.code=='ArrowUp')MC=(MC+n-1)%n;else if(e.code=='KeyS'||e.code=='ArrowDown')MC=(MC+1)%n;else if(e.code=='KeyE'||e.code=='Enter')equipCur()}}
  return}
 if(state=='smith'){if(e.code=='Escape'||e.code=='KeyE')state='play';else if(/^Digit[1-9]$/.test(e.code))craft(+e.code.slice(-1)-1);return}
 if(state=='skills'||state=='stats'){
  if(e.code=='Escape'||(e.code=='KeyT'&&state=='skills')||(e.code=='KeyY'&&state=='stats'))state='church';
  else if(e.code=='KeyT')state='skills';
  else if(e.code=='KeyY')state='stats';
  else if(/^Digit[1-5]$/.test(e.code)){
   const i=+e.code.slice(-1)-1;
   if(state=='skills'){if(pts()>0){if(i==0&&P.ba<15)P.ba++;else if(i>0&&i<3&&P.job!='none'&&P.sk[i-1]<15)P.sk[i-1]++}}
   else{const n=Math.min(e.shiftKey?10:1,stp(),100-P.st[i]);if(n>0)P.st[i]+=n}
  }
  return;
 }
 if(e.code=='KeyB'){if(B){E=[];B=null;clr();say('撤退した')}else startBoss();return}
 if(e.code=='KeyV'){if(B){E=[];B=null;clr();say('撤退した')}else startBoss2();return}
 if(e.code=='Tab'){state='menu';MC=0;return}
 if(e.code=='KeyE'){act();return}
 if(e.code=='KeyF'&&!B){goField((FI+1)%FD.length,-1);return}
 if(e.key=='+'||e.key=='=')setLv(P.lv+1);
 else if(e.key=='-')setLv(P.lv-1);
 else if(e.key=='0')setLv(10);
 else if(e.key=='5')setLv(50);
});
addEventListener('keyup',e=>K[e.code]=0);
function nearest(m){let b=null,bd=m;for(const e of E){const d=Math.hypot(e.x-P.x,e.y-P.y)-(e.rad||0);if(d<bd){bd=d;b=e}}return b}
function hurt(e,m){
 if(e.inv>0){const t=performance.now();if(t-(e.ft||0)>400){e.ft=t;fl(e.x,e.y-14,'無敵','#ffe27a',15)}return}
 const cr=Math.random()<.15,d=Math.round((J().atk+(P.eq.w?P.eq.w.v:0)+P.lv*1.6)*(1+.02*P.st[J().mg?3:2])*m*(.9+Math.random()*.2)*(cr?2:1));
 e.hp-=d;e.fl=.1;fl(e.x,e.y-14,d+(cr?'!':''),cr?'#ffd84a':'#fff',cr?24:15);
 if(e.hp<=0){E.splice(E.indexOf(e),1);if(e.boss){B=null;clr();say('ボス撃破!');if(!e.k2&&P.lv==GATE-1&&!P.gk){P.gk=1;say('試練達成!')}gain(Math.round(need(P.lv)*(e.k2?1.2:.8)))}else{gain(Math.round((4+e.lv*2)*(e.xp||1)));drop(e)}}
}
function use(i){
 if(P.cd[i]>0)return;const j=J();
 if(i==0){
  P.cd[0]=aInt();const t=nearest(j.r+20);
  if(t){ring(t.x,t.y,16,j.c,.15);hurt(t,aMul())}else ring(P.x+P.face*24,P.y,14,j.c,.12);
  return;
 }
 const s=j.sk&&j.sk[i-1];if(!s)return;
 if(P.mp<s.mp){P.cd[i]=.4;fl(P.x,P.y-24,'MP不足','#8fd3ff',14);return}P.mp-=s.mp;
 P.cd[i]=scd(s,i-1);
 if(s.heal){P.hp=Math.min(maxHp(),P.hp+Math.round(maxHp()*sh(s,i-1)));fl(P.x,P.y-24,'HEAL','#7dff9d',18);ring(P.x,P.y,70,j.c);return}
 const t=s.self?null:nearest(230),cx=t?t.x:P.x,cy=t?t.y:P.y;
 ring(cx,cy,s.r,j.c,.45);
 for(const e of [...E])if(Math.hypot(e.x-cx,e.y-cy)<s.r+10+(e.rad||0))hurt(e,sm(s,i-1));
 if(s.h)P.hp=Math.min(maxHp(),P.hp+Math.ceil(maxHp()*s.h*(1+.02*P.st[3])));
}
function startBoss(){
 const lv=10,h=Math.round((10+lv*6+lv**3*.02)*20);
 E=[{x:400,y:110,lv,hp:h,mh:h,sp:30,dm:Math.round(3+lv*1.2),fl:0,rad:40,boss:1,n:'クリスタルドレイク',cdT:2,ph:1}];B=E[0];clr();P.x=400;P.y=410;say('クリスタルドレイク 出現!');
}
function bossAtk(){
 const dm=Math.round(5+B.lv*1.8),n=3,k=B.ph==2?1.3:1;
 if(Math.random()<.5)HZ.push({x:B.x,y:B.y,r:Math.round(180*k),t:1.4,d:1.4,dm});
 else for(let i=0;i<n;i++){const t=1.1+i*.35;HZ.push({x:P.x+(i?(Math.random()-.5)*220:0),y:P.y+(i?(Math.random()-.5)*220:0),r:Math.round(65*k),t,d:t,dm})}
}
function pdmg(d,t){if(P.hit<=0){d=tk(d);P.hp-=d;P.hit=t;fl(P.x,P.y-24,'-'+d,'#ff6b6b',18)}}
function startBoss2(){
 const lv=P.lv,h=Math.round((10+lv*6+lv**3*.02)*24);
 E=[{x:400,y:110,lv,hp:h,mh:h,sp:0,dm:Math.round(3+lv*1.2),fl:0,rad:34,boss:1,k2:1,cdT:2,ph:1,tm:0,inv:0}];B=E[0];clr();P.x=400;P.y=410;say('ボス2戦開始!');
}
function startUlt(k){
 const sp=k=='spin';U={k,t:0,dur:sp?6.2:6.4,a:Math.random()*6.28};B.ph++;B.inv=U.dur+.3;PJ=[];LS=[];
 say(sp?'ボスが無敵に! 回転ビーム!':'ボスが無敵に! ナイフの雨!');
 if(!sp){const L=[];for(let i=0;i<40;i++)L.push(150+i*500/39);for(let i=L.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[L[i],L[j]]=[L[j],L[i]]}
  L.forEach((lx,i)=>PJ.push({kn:1,x:lx-380*(H-4)/560,y:-10,vx:380,vy:560,w:1.2+i*.08,dm:Math.round(6+P.lv*2),b:0,lx}))}
}
const spA=t=>{const tr=3.6;return U.a+1.25*(t<tr?t:t<tr+.35?tr:2*tr+.35-t)};
function boss2(dt){
 B.tm+=dt;B.inv=Math.max(0,B.inv-dt);
 const dm=Math.round(5+P.lv*1.8),k=B.ph>=2?1.3:1,f=B.hp/B.mh;
 for(const p of PJ){
  if(p.w>0){p.w-=dt;continue}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.kn&&!p.b&&p.y>=H-14){p.b=1;p.vy=-p.vy;p.y=H-14;ring(p.x,H-14,26,'#fff',.25)}
  if(Math.hypot(P.x-p.x,P.y-p.y)<(p.kn?9:8)+13)pdmg(p.dm,.6);
 }
 PJ=PJ.filter(p=>p.x>-250&&p.x<W+60&&p.y>-60&&p.y<H+60);
 for(const l of LS){
  if(l.w>0){l.w-=dt;continue}
  l.on-=dt;
  if(!l.h){const c=Math.cos(l.a),s=Math.sin(l.a),dx=P.x-l.x,dy=P.y-l.y;if(dx*c+dy*s>0&&Math.abs(-dx*s+dy*c)<l.wd/2+12){l.h=1;pdmg(l.dm,.6)}}
 }
 LS=LS.filter(l=>l.on>0);
 if(U){
  U.t+=dt;if(U.k=='spin'&&!U.r&&U.t>=3.6){U.r=1;say('逆回転!')}B.x+=(400-B.x)*Math.min(1,3*dt);B.y+=((U.k=='knife'?30:190)-B.y)*Math.min(1,3*dt);
  if(U.k=='spin'&&U.t>1.2){const dmg=Math.round(7+P.lv*2.2);for(let i=0;i<5;i++){const a=spA(U.t)+i*2*Math.PI/5,dx=P.x-B.x,dy=P.y-B.y;if(dx*Math.cos(a)+dy*Math.sin(a)>0&&Math.abs(-dx*Math.sin(a)+dy*Math.cos(a))<25)pdmg(dmg,.5)}}
  if(U.t>=U.dur){U=null;B.inv=0;B.cdT=1.8;say('無敵解除!')}
  return;
 }
 B.y+=(110-B.y)*Math.min(1,2*dt);B.x+=(400+Math.sin(B.tm*.6)*230-B.x)*Math.min(1,2*dt);
 if(B.ph==1&&f<.5){startUlt('spin');return}
 if(B.ph==2&&f<.25){startUlt('knife');return}
 B.cdT-=dt;
 if(B.cdT<=0){
  B.cdT=2.3;const a=Math.atan2(P.y-B.y,P.x-B.x);
  if(Math.random()<.5){const n=B.ph>=2?5:3;for(let i=0;i<n;i++){const aa=a+(i-(n-1)/2)*.28;PJ.push({sp:1,x:B.x,y:B.y,vx:Math.cos(aa)*420,vy:Math.sin(aa)*420,w:.7,dm})}}
  else LS.push({x:B.x,y:B.y,a,w:1,on:.3,wd:Math.round(26*k),dm:Math.round(dm*1.2),h:0});
 }
}
function spawn(){
 let x,y;do{x=30+Math.random()*(W-60);y=30+Math.random()*(H-60)}while(Math.hypot(x-P.x,y-P.y)<220);
 const f=FD[FI],t=TY[pick(f.en)],lv=f.lv[0]+Math.floor(Math.random()*(f.lv[1]-f.lv[0]+1)),h=Math.max(1,Math.round((10+lv*6+lv**3*.02)*t.hp));
 E.push({x,y,lv,hp:h,mh:h,sp:(45+Math.random()*25)*t.sp,dm:Math.max(1,Math.round((1+lv*.9)*t.dm)),fl:0,n:t.n,c:t.c,vr:t.r,xp:t.xp,dr:t.dr});
}
function update(dt){
 const px=P.x,py=P.y;

function applySave(d){
 if(!d||!Number.isFinite(d.lv))return false;
 P.lv=Math.max(1,Math.min(50,d.lv));P.exp=d.exp||0;P.job=JOBS[d.job]?d.job:'none';P.sk=[0,1].map(i=>(d.sk&&d.sk[i])||1);P.ba=d.ba||1;

 P.inv=d.inv||{};P.cr=d.cr||{};P.gk=d.gk?1:0;
 const e=d.eq||{};P.eq={w:RC.find(r=>r.id==e.w)||null,a:RC.find(r=>r.id==e.a)||null};
 P.hp=maxHp();P.mp=maxMp();goField(0,-1);state=(P.lv>=10&&P.job=='none')?'select':'play';return true;
}
