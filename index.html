function seBase(n){
 if(SEB[n])return SEB[n];
 const ex=['mp3','MP3'];let k=0;const a=new Audio();a.preload='auto';
 a.onerror=()=>{if(++k<ex.length)a.src=SEDIR+n+'.'+ex[k];else{a.bad=1;console.warn('効果音が見つかりません: '+SEDIR+n+'.(mp3/MP3)')}};
 a.src=SEDIR+n+'.'+ex[0];return SEB[n]=a;

function SE(n,vol=1){
 if(SET.se<=0)return;
 const now=performance.now(),f=SEF[n],gap=f&&f.gap||70;
 if(now-(seT[n]||0)<gap)return;seT[n]=now;
 try{
  if(f){const b=seBase(n);if(b.bad)return;const a=b.cloneNode();a.volume=Math.min(1,SET.se/100*f.v*vol);a.play().catch(()=>{});if(f.max)setTimeout(()=>a.pause(),f.max*1000);return}

  AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
  o.type=y[3];o.frequency.setValueAtTime(y[0],t);o.frequency.exponentialRampToValueAtTime(y[1],t+y[2]);
  gn.gain.setValueAtTime(Math.max(.001,SET.se/100*y[4]*vol),t);gn.gain.exponentialRampToValueAtTime(.0001,t+y[2]);
  o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+y[2]+.02);
 }catch(e){}
}
